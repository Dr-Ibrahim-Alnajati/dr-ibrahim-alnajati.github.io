name: Update lectures

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-lectures
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Build lectures.json from the channel playlists
        run: python scripts/build_lectures.py
      - name: Commit and request a Pages build if the list changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain -- lectures.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lectures.json
            git commit -m "Update lectures from YouTube playlists"
            git push
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
          else
            echo "No changes"
          fi
